version: 2

models:
  - name: stg_stackoverflow
    description: "SO Survey respondent-technology pairs (one row per respondent per tech)"
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: respondent_id
        tests:
          - not_null
      - name: technology_raw
        tests:
          - not_null
      - name: tech_category
        tests:
          - not_null
          - accepted_values:
              values: ['language', 'database', 'webframe', 'platform']

  - name: stg_adzuna
    description: "Adzuna job postings exploded by matched technology keyword"
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: job_id
        tests:
          - not_null
      - name: created_date
        tests:
          - not_null
      - name: technology_keyword
        tests:
          - not_null

  - name: stg_github_repos
    description: "GitHub repository records per technology per snapshot date"
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: repo_id
        tests:
          - not_null
      - name: technology_slug
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
      - name: quality_class
        tests:
          - not_null
          - accepted_values:
              values: ['project', 'educational', 'collection', 'other', 'uncertain', 'excluded']
      - name: stars
        tests:
          - not_null

  - name: stg_github_snapshots
    description: "GitHub ecosystem snapshot metrics per technology per date"
    columns:
      - name: record_id
        tests:
          - not_null
          - unique
      - name: technology_name
        tests:
          - not_null
      - name: snapshot_date
        tests:
          - not_null
      - name: observed_repositories
        tests:
          - not_null
      - name: usable_repositories
        tests:
          - not_null
